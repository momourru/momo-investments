<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Momo's Investment Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#f0ede6;--card:#fff;--c2:#f7f5f0;--c3:#eceae3;--bdr:rgba(0,0,0,0.07);--bdr2:rgba(0,0,0,0.12);--txt:#6b7280;--dark:#111827;--dim:#9ca3af;--r:14px;--sh:0 1px 3px rgba(0,0,0,0.04),0 4px 16px rgba(0,0,0,0.06);--sh2:0 8px 32px rgba(0,0,0,0.12);}
html,body{background:var(--bg);color:var(--txt);font-family:'DM Sans',sans-serif;font-size:14px;min-height:100vh;}
.nav{background:var(--card);border-bottom:1px solid var(--bdr);padding:0 24px;position:sticky;top:0;z-index:200;box-shadow:0 1px 8px rgba(0,0,0,0.05);}
.nav-inner{max-width:1300px;margin:0 auto;display:flex;align-items:center;gap:12px;height:54px;}
.logo-wrap{display:flex;flex-direction:column;align-items:flex-start;flex-shrink:0;line-height:1;}
.logo-line1{font-size:15px;font-weight:800;color:#1e2d3d;letter-spacing:-.3px;white-space:nowrap;}
.logo-green{color:#85df04;font-weight:800;}
.logo-line2{display:flex;align-items:center;gap:6px;margin-top:1px;}
.logo-rule{height:1px;background:linear-gradient(90deg,transparent,#85df04,transparent);width:28px;display:block;}
.logo-calc{font-size:9px;font-weight:400;letter-spacing:3px;text-transform:uppercase;color:#4a6070;white-space:nowrap;}
.mtabs{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none;}
.mtabs::-webkit-scrollbar{display:none;}
.mtbtn{background:none;border:none;color:var(--txt);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;padding:6px 14px;border-radius:30px;cursor:pointer;white-space:nowrap;transition:all .18s;}
.mtbtn:hover{background:var(--c2);color:var(--dark);}
.mtbtn.on{background:var(--dark);color:#fff;font-weight:600;}
.ndate{font-size:11px;color:var(--dim);flex-shrink:0;}
.subnav{background:var(--card);border-bottom:1px solid var(--bdr);padding:0 24px;position:sticky;top:54px;z-index:199;}
.subnav-inner{max-width:1300px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none;}
.subnav-inner::-webkit-scrollbar{display:none;}
.stbtn{background:none;border:none;border-bottom:3px solid transparent;color:var(--txt);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;padding:11px 18px;cursor:pointer;white-space:nowrap;transition:all .18s;display:flex;align-items:center;gap:6px;}
.stbtn:hover{color:var(--dark);}
.stbtn.on{font-weight:700;}
.sdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.main{max-width:1300px;margin:0 auto;padding:20px 24px 48px;}
.tv{display:none;animation:fi .2s ease;}.tv.on{display:block;}
.stv{display:none;}.stv.on{display:block;animation:fi .18s ease;}
@keyframes fi{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.slbl{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:12px;}
/* CALC STRIP */
.cstrip{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);box-shadow:var(--sh);padding:16px 22px;margin-bottom:14px;}
.cstrip-lbl{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:8px;}
.crow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.awrap{display:flex;align-items:center;gap:5px;background:var(--c2);border:1.5px solid var(--bdr2);border-radius:12px;padding:7px 14px;transition:border-color .2s;flex-shrink:0;}
.awrap:focus-within{border-color:#85df04;}
.asym{font-family:'Space Mono',monospace;font-size:16px;color:var(--dim);}
.ainp{background:none;border:none;outline:none;color:var(--dark);font-family:'Space Mono',monospace;font-size:24px;font-weight:700;width:170px;-moz-appearance:textfield;}
.ainp::-webkit-outer-spin-button,.ainp::-webkit-inner-spin-button{-webkit-appearance:none;}
.dvd{width:1px;height:34px;background:var(--bdr2);flex-shrink:0;}
.presets{display:flex;gap:5px;flex-wrap:wrap;}
.preset{background:var(--c2);border:1px solid var(--bdr2);border-radius:7px;color:var(--txt);font-size:12px;font-weight:500;padding:6px 11px;cursor:pointer;transition:all .14s;}
.preset:hover{background:var(--dark);border-color:var(--dark);color:#fff;}
.drow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.ditem{font-size:11px;font-weight:500;display:flex;align-items:center;gap:4px;}
.ddot{width:5px;height:5px;border-radius:50%;}
/* DASHBOARD 3COL */
.dash3col{display:grid;grid-template-columns:210px 1fr 270px;gap:14px;}
.dash-left{display:flex;flex-direction:column;gap:9px;}
.dpcard{border-radius:14px;padding:18px 16px 0;cursor:pointer;transition:transform .2s,box-shadow .2s;overflow:hidden;}
.dpcard:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,0.12);}
.dpcard-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.dpcard-name{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;line-height:1.3;}
.dpcard-arr{font-size:13px;opacity:.45;transition:all .2s;}
.dpcard:hover .dpcard-arr{opacity:.9;transform:translate(2px,-2px);}
.dpcard-pct{font-family:'Bebas Neue',sans-serif;font-size:36px;line-height:1;margin-bottom:6px;opacity:.75;}
.dpcard-pct sup{font-size:16px;}
.dpcard-amt-lbl{font-size:9px;text-transform:uppercase;letter-spacing:1px;opacity:.6;font-weight:600;}
.dpcard-amt{font-family:'Bebas Neue',sans-serif;font-size:52px;line-height:1;margin-top:2px;margin-bottom:2px;}
.dpcard-meta{font-size:10px;opacity:.55;margin:6px 0 14px;}
.dpcard-chg{font-size:11px;font-weight:600;padding-bottom:14px;}
/* CENTER CHART CARD */
.dcc{background:var(--card);border:1px solid var(--bdr);border-radius:14px;box-shadow:var(--sh);padding:22px;display:flex;flex-direction:column;}
.dcc-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;flex-wrap:wrap;gap:8px;}
.dcc-title{font-size:16px;font-weight:700;color:var(--dark);}
.dcc-sub{font-size:12px;color:var(--txt);margin-top:3px;}
.chart-toggle{display:flex;gap:5px;}
.ct-btn{background:var(--c2);border:1px solid var(--bdr2);border-radius:7px;color:var(--txt);font-size:11px;font-weight:500;padding:5px 11px;cursor:pointer;transition:all .14s;}
.ct-btn.on{background:var(--dark);color:#fff;border-color:var(--dark);}
/* PNL */
.pnl-strip{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:14px 0;}
.pnl-box{background:var(--c2);border-radius:11px;padding:13px 16px;border:1px solid var(--bdr);}
.pnl-lbl{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:5px;}
.pnl-val{font-family:'Bebas Neue',sans-serif;font-size:38px;line-height:1;color:var(--dark);}
.pnl-val.up{color:#85df04;}.pnl-val.dn{color:#ef4444;}
.pnl-sub{font-size:11px;margin-top:3px;color:var(--txt);}
.pnl-sub.up{color:#85df04;}.pnl-sub.dn{color:#ef4444;}
.price-bar{display:flex;justify-content:space-between;align-items:center;padding:6px 0 12px;flex-wrap:wrap;gap:6px;}
.price-status{font-size:11px;color:var(--dim);}
.price-refresh{background:none;border:1px solid var(--bdr2);border-radius:7px;color:var(--txt);font-size:11px;padding:4px 10px;cursor:pointer;transition:all .14s;}
.price-refresh:hover{background:var(--dark);color:#fff;border-color:var(--dark);}
.price-loading{display:inline-block;width:9px;height:9px;border:2px solid var(--bdr2);border-top-color:var(--dark);border-radius:50%;animation:spin .7s linear infinite;margin-right:4px;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}
/* EMPTY */
.dcc-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;min-height:220px;color:var(--dim);text-align:center;gap:8px;}
.dcc-empty-ico{font-size:36px;}.dcc-empty-t{font-size:14px;font-weight:600;color:var(--dark);}
.dcc-empty-s{font-size:12px;line-height:1.5;}
.dcc-empty-btn{background:var(--dark);border:none;border-radius:9px;color:#fff;font-size:12px;font-weight:600;padding:8px 16px;cursor:pointer;margin-top:4px;}
.dcc-empty-btn:hover{background:#85df04;color:#111;}
/* RIGHT STOCKS */
.dsc{background:var(--card);border:1px solid var(--bdr);border-radius:14px;box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;}
.dsc-hdr{padding:16px 18px 12px;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.dsc-title{font-size:15px;font-weight:600;color:var(--dark);}
.dsc-sub{font-size:10px;color:var(--dim);}
.dsc-list{overflow-y:auto;flex:1;}
.stk-item{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--bdr);transition:background .12s;cursor:pointer;}
.stk-item:hover{background:var(--c2);}
.stk-item:last-child{border-bottom:none;}
.stk-ico{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:10px;font-weight:700;color:#fff;flex-shrink:0;}
.stk-info{flex:1;min-width:0;}
.stk-tk{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;color:var(--dark);}
.stk-nm{font-size:10px;color:var(--txt);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.stk-right{text-align:right;flex-shrink:0;}
.stk-amt{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;color:var(--dark);}
.stk-chg{font-size:10px;margin-top:2px;}
.stk-chg.up{color:#85df04;}.stk-chg.dn{color:#ef4444;}.stk-chg.neu{color:var(--dim);}
/* CALC TAB */
.port-sel{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;}
.pselbtn{background:var(--c2);border:2px solid var(--bdr2);border-radius:9px;color:var(--txt);font-size:12px;font-weight:500;padding:7px 14px;cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:5px;}
.cport-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.cportcard{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;}
.cph{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 8px;}
.cph-l{display:flex;align-items:center;gap:7px;}
.cph-dot{width:9px;height:9px;border-radius:50%;}
.cph-nm{font-size:14px;font-weight:700;}
.cph-r{text-align:right;}
.cph-lbl{font-size:10px;color:var(--dim);}
.cph-amt{font-family:'Space Mono',monospace;font-size:15px;font-weight:700;}
.ctbl td{padding:7px 12px;border-bottom:1px solid var(--bdr);font-size:12px;vertical-align:middle;}
.ctbl td.r{text-align:right;font-family:'Space Mono',monospace;}
.ctbl tr:last-child td{border-bottom:none;}
.ctbl tr:hover td{background:var(--c2);}
.ctotrow td{background:var(--c2);font-weight:700;border-top:1px solid var(--bdr2);font-family:'Space Mono',monospace;font-size:12px;}
/* PORTFOLIO HERO */
.port-hero{padding:22px;border-radius:var(--r);margin-bottom:14px;}
.ph-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;}
.ph-name{font-family:'Bebas Neue',sans-serif;font-size:50px;line-height:1;letter-spacing:2px;color:#fff;}
.ph-desc{font-size:13px;color:rgba(255,255,255,.75);max-width:400px;line-height:1.5;margin-top:5px;}
.ph-risk{display:inline-block;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:600;color:#fff;margin-top:7px;}
.ph-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px;}
.phstat{background:rgba(255,255,255,.15);border-radius:11px;padding:13px;}
.phstat-l{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.6);margin-bottom:5px;}
.phstat-v{font-family:'Space Mono',monospace;font-size:19px;font-weight:700;color:#fff;}
.phstat-s{font-size:10px;color:rgba(255,255,255,.55);margin-top:2px;}
.pmcalc{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);box-shadow:var(--sh);padding:14px 18px;margin-bottom:14px;}
.pmcalc-t{font-size:13px;font-weight:700;color:var(--dark);margin-bottom:9px;display:flex;align-items:center;gap:5px;}
.pmcalc-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.pmwrap{display:flex;align-items:center;gap:4px;background:var(--c2);border:1.5px solid var(--bdr2);border-radius:10px;padding:6px 11px;transition:border-color .2s;}
.pmwrap:focus-within{border-color:#85df04;}
.pmsym{font-family:'Space Mono',monospace;font-size:13px;color:var(--dim);}
.pminp{background:none;border:none;outline:none;color:var(--dark);font-family:'Space Mono',monospace;font-size:19px;font-weight:700;width:120px;-moz-appearance:textfield;}
.pminp::-webkit-outer-spin-button,.pminp::-webkit-inner-spin-button{-webkit-appearance:none;}
.pmpresets{display:flex;gap:5px;flex-wrap:wrap;}
.pmpreset{background:var(--c2);border:1px solid var(--bdr2);border-radius:7px;color:var(--txt);font-size:11px;font-weight:500;padding:5px 9px;cursor:pointer;transition:all .14s;}
.pmpreset:hover{background:var(--dark);color:#fff;border-color:var(--dark);}
/* TABLES */
.tcard{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;}
.tcard-hdr{display:flex;justify-content:space-between;align-items:center;padding:14px 20px 10px;border-bottom:1px solid var(--bdr);}
.tc-title{font-size:14px;font-weight:600;color:var(--dark);}
.tc-sub{font-size:11px;color:var(--txt);margin-top:2px;}
table{width:100%;border-collapse:collapse;}
th{padding:8px 16px;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);background:var(--c2);text-align:left;border-bottom:1px solid var(--bdr);}
th.r{text-align:right;}
td{padding:9px 16px;border-bottom:1px solid var(--bdr);vertical-align:middle;}
td.r{text-align:right;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:var(--c2);}
.rnk{font-family:'Space Mono',monospace;font-size:11px;color:var(--dim);}
.tk{font-family:'Space Mono',monospace;font-size:14px;font-weight:700;color:var(--dark);}
.co{font-size:11px;color:var(--txt);margin-top:1px;}
.pbadge{display:inline-block;padding:2px 7px;border-radius:6px;font-size:10px;font-weight:600;}
.barr{display:flex;align-items:center;gap:7px;min-width:90px;}
.btrack{flex:1;height:4px;background:var(--c3);border-radius:2px;overflow:hidden;}
.bfill{height:100%;border-radius:2px;}
.bpct{font-family:'Space Mono',monospace;font-size:11px;color:var(--dark);min-width:26px;text-align:right;}
.pamt{font-family:'Space Mono',monospace;font-size:14px;font-weight:700;color:var(--dark);}
.totrow td{background:var(--c2);font-weight:700;border-top:1px solid var(--bdr2);}
/* POSITION EXPAND */
.posrow{cursor:pointer;}
.posrow.expanded td{background:var(--c2);}
.posexp td{padding:0;}
.expinner{padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.pe-info{background:var(--card);border-radius:11px;padding:13px;border:1px solid var(--bdr);}
.pe-nm{font-size:15px;font-weight:700;color:var(--dark);margin-bottom:4px;}
.pe-desc{font-size:12px;color:var(--txt);line-height:1.6;margin-bottom:8px;}
.pe-tags{display:flex;gap:5px;flex-wrap:wrap;}
.pe-tag{background:var(--c2);border:1px solid var(--bdr);border-radius:6px;font-size:10px;font-weight:600;padding:2px 7px;color:var(--dark);}
.pe-hist{background:var(--card);border-radius:11px;padding:13px;border:1px solid var(--bdr);}
.pe-hist-t{font-size:11px;font-weight:700;color:var(--dark);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px;}
.pe-hi{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--bdr);}
.pe-hi:last-child{border-bottom:none;}
.pe-hid{font-size:11px;color:var(--txt);}
.pe-hia{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;}
.pe-hsum{display:flex;justify-content:space-between;padding:8px 0 0;margin-top:4px;border-top:2px solid var(--bdr2);}
.pe-hsum-l{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--dim);}
.pe-hsum-v{font-family:'Space Mono',monospace;font-size:15px;font-weight:700;}
.chevron{display:inline-block;transition:transform .2s;font-size:9px;color:var(--dim);margin-left:3px;}
.posrow.expanded .chevron{transform:rotate(180deg);}
/* HISTORIAL */
.htotalcard{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);box-shadow:var(--sh);padding:22px;margin-bottom:14px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
.htc-main{flex:1;min-width:140px;}
.htc-lbl{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:5px;}
.htc-val{font-family:'Bebas Neue',sans-serif;font-size:54px;line-height:1;color:#85df04;}
.htc-meta{font-size:12px;color:var(--txt);margin-top:4px;}
.htc-stats{display:flex;gap:16px;flex-wrap:wrap;}
.htc-stat-v{font-family:'Space Mono',monospace;font-size:17px;font-weight:700;color:var(--dark);}
.htc-stat-l{font-size:11px;color:var(--txt);margin-top:2px;}
.pjcard{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);box-shadow:var(--sh);padding:20px;}
.pj-t{font-size:15px;font-weight:600;color:var(--dark);margin-bottom:3px;}
.pj-s{font-size:12px;color:var(--txt);margin-bottom:14px;line-height:1.5;}
/* PROJ CONTROLS */
.proj-controls{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px;padding:14px 16px;background:var(--c2);border-radius:12px;}
.proj-ctrl-group{display:flex;flex-direction:column;gap:6px;}
.proj-ctrl-lbl{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);}
.proj-ctrl-btns{display:flex;gap:5px;flex-wrap:wrap;}
.pctrl-btn{background:var(--card);border:1.5px solid var(--bdr2);border-radius:8px;color:var(--txt);font-size:12px;font-weight:500;padding:6px 13px;cursor:pointer;transition:all .15s;white-space:nowrap;}
.pctrl-btn:hover{border-color:var(--dark);color:var(--dark);}
.pctrl-btn.on{background:var(--dark);color:#fff;border-color:var(--dark);font-weight:700;}
.pctrl-sep{width:1px;height:36px;background:var(--bdr2);flex-shrink:0;}
.yr-inline{display:flex;align-items:center;gap:5px;background:var(--card);border:1.5px solid var(--bdr2);border-radius:8px;padding:5px 10px;}
.yr-inline:focus-within{border-color:var(--dark);}
.yr-inline input{background:none;border:none;outline:none;color:var(--dark);font-family:'Space Mono',monospace;font-size:14px;font-weight:700;width:40px;text-align:center;-moz-appearance:textfield;}
.yr-inline input::-webkit-outer-spin-button,.yr-inline input::-webkit-inner-spin-button{-webkit-appearance:none;}
.proj-legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;}
.pl-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--txt);}
.pl-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
/* HIST FORM */
.hist-form{display:flex;flex-direction:column;gap:12px;padding:14px;background:var(--c2);border-radius:12px;margin-bottom:12px;}
.hist-form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
.hfield{display:flex;flex-direction:column;gap:4px;}
.hfield label{font-size:10px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:1px;}
.hfield input{background:var(--card);border:1.5px solid var(--bdr2);border-radius:8px;color:var(--dark);font-size:14px;padding:8px 10px;outline:none;transition:border-color .2s;}

function setSyncStatus(st, msg) {
  const dot = document.getElementById('sync-dot');
  const txt = document.getElementById('sync-txt');
  if (!dot || !txt) return;
  dot.className = 'sync-dot ' + st;
  const msgs = {
    ok:      '<strong>Google Sheets</strong> — sincronizado ✓',
    saving:  'Guardando en Google Sheets...',
    loading: 'Cargando desde Google Sheets...',
    error:   '⚠ Sin conexión a Sheets — trabajando en modo local',
    offline: 'Modo local — sin conexión a Sheets'
  };
  txt.innerHTML = msg || msgs[st] || '';
  // Show/hide the quick migrate button in the sync bar
  const mqb = document.getElementById('migrate-quick-btn');
  if (mqb) mqb.style.display = (st === 'error') ? 'inline-block' : 'none';
}

async function sheetsGet(params) {
  const url = SHEETS_URL + '?' + new URLSearchParams(params).toString();
  const r = await fetch(url, {cache:'no-store'});
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function loadFromSheets() {
  setSyncStatus('loading');
  try {
    const res = await sheetsGet({action: 'load'});
    if (!res.ok) throw new Error(res.error);

    const sheetsData = res.data || [];
    const localData  = JSON.parse(localStorage.getItem('momo_hist') || '[]');

    // SAFETY: Sheets vacío pero local tiene datos → NO sobreescribir
    if (sheetsData.length === 0 && localData.length > 0) {
      history = localData;
      setSyncStatus('error',
        '⚠ Sheets está vacío pero tienes <strong>' + localData.length +
        ' inversiones locales</strong> — usa el botón "Migrar" para subirlas');
      refreshAll();
      // Force show migrate banner regardless of tab
      setTimeout(() => {
        const banner = document.getElementById('migrate-banner');
        if (banner && localData.length > 0) banner.style.display = 'flex';
      }, 200);
      return;
    }

    // MERGE: unión de ambas fuentes — Sheets tiene prioridad en conflictos
    const sheetsMap = new Map(sheetsData.map(e => [e.id, e]));
    const localMap  = new Map(localData.map(e  => [e.id, e]));
    const allIds    = new Set([...sheetsMap.keys(), ...localMap.keys()]);
    const merged    = [...allIds]
      .map(id => sheetsMap.get(id) || localMap.get(id))
      .filter(Boolean)
      .sort((a, b) => b.id - a.id);

    history = merged;
    localStorage.setItem('momo_hist', JSON.stringify(history));

    if (merged.length > sheetsData.length) {
      // Hay entradas locales que no están en Sheets → avisamos
      setSyncStatus('error',
        '⚠ ' + (merged.length - sheetsData.length) +
        ' inversiones locales no están en Sheets — usa "Migrar" para subirlas');
    } else {
      setSyncStatus('ok');
    }
    refreshAll();
    checkMigrateBanner();

  } catch(e) {
    setSyncStatus('error');
    history = JSON.parse(localStorage.getItem('momo_hist') || '[]');
    refreshAll();
    checkMigrateBanner();
  }
}

}

async function sheetsAdd(entry) {
  setSyncStatus('saving');
  try {
    const res = await sheetsGet({action:'add', entry: encodeURIComponent(JSON.stringify(entry))});
    if (res.ok) {
      // Merge Sheets response with local (local already has optimistic entry)
      const sheetsMap = new Map((res.data||[]).map(e => [e.id, e]));
      const localMap  = new Map(history.map(e => [e.id, e]));
      const allIds    = new Set([...sheetsMap.keys(), ...localMap.keys()]);
      history = [...allIds].map(id => sheetsMap.get(id)||localMap.get(id)).filter(Boolean).sort((a,b)=>b.id-a.id);
      localStorage.setItem('momo_hist', JSON.stringify(history));
      setSyncStatus('ok');
    } else throw new Error(res.error);
  } catch(e) {
    // Keep local data, just warn
    setSyncStatus('error', '⚠ No se pudo guardar en Sheets — datos guardados localmente. Usa "Migrar" para subir.');
  }
}

async function sheetsDelete(id) {
  setSyncStatus('saving');
  try {
    const res = await sheetsGet({action:'delete', id});
    if (res.ok) {
      history = (res.data||[]).sort((a,b)=>b.id-a.id);
      localStorage.setItem('momo_hist', JSON.stringify(history));
      setSyncStatus('ok');
    } else throw new Error(res.error);
  } catch(e) {
    setSyncStatus('error', '⚠ No se pudo eliminar en Sheets — cambio guardado localmente.');
  }
}

    } else throw new Error(res.error);
  } catch(e) {
    setSyncStatus('error', '⚠ No se pudo actualizar en Sheets — cambio guardado localmente.');
  }
}

async function migrateLocalToSheets() {
  const local = JSON.parse(localStorage.getItem('momo_hist') || '[]');
  if (!local.length) { alert('No hay datos en localStorage para migrar.'); return; }
  setSyncStatus('saving', 'Migrando ' + local.length + ' inversiones a Google Sheets...');
  try {
    const res = await sheetsGet({action:'migrate', payload: encodeURIComponent(JSON.stringify(local))});
    if (res.ok) {
      history = res.data;
      localStorage.setItem('momo_hist', JSON.stringify(history));
      setSyncStatus('ok');
      refreshAll();
      hideMigrateBanner();
      alert('✓ ' + local.length + ' inversiones migradas a Google Sheets.');
    } else throw new Error(res.error);
  } catch(e) {
    setSyncStatus('error');
    alert('Error al migrar: ' + e.message);
  }
}

function checkMigrateBanner() {
  // Show banner whenever sync status is not 'ok' and we have local data
  const local = JSON.parse(localStorage.getItem('momo_hist') || '[]');
  const banner = document.getElementById('migrate-banner');
  if (!banner) return;
  const dot = document.getElementById('sync-dot');
  const isError = dot && dot.classList.contains('error');
  banner.style.display = (isError && local.length > 0) ? 'flex' : 'none';
}

function hideMigrateBanner() {
  const banner = document.getElementById('migrate-banner');
  if (banner) banner.style.display = 'none';
}

/* ─── HELPERS ─── */
const fm=v=>{if(!v||v<0.005)return'$0.00';if(v>=1e6)return'$'+(v/1e6).toFixed(2)+'M';if(v>=1000)return'$'+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});return'$'+v.toFixed(2);};
const fv=(pv,r,n)=>pv*Math.pow(1+r,n);
const ht=()=>history.reduce((s,h)=>s+h.amt,0);
const saveH=()=>localStorage.setItem('momo_hist',JSON.stringify(history));

function histPortAmt(entry,portId){
  if(!entry.alloc){const p=P.find(x=>x.id===portId);return p?entry.amt*p.pct/100:0;}
  return entry.amt*(entry.alloc[portId]||0);
}
function portTotalInvested(portId){return history.reduce((s,h)=>s+histPortAmt(h,portId),0);}

function getHistSelPorts(){if(!histSelPorts)histSelPorts=P.map(p=>p.id);return histSelPorts;}
function getFormAlloc(){
  const sel=getHistSelPorts();
  const totPct=sel.reduce((s,pid)=>{const p=P.find(x=>x.id===pid);return s+(p?p.pct:0);},0);
  const alloc={};
  sel.forEach(pid=>{const p=P.find(x=>x.id===pid);if(p)alloc[pid]=p.pct/totPct;});
  return alloc;
}

/* ─── LIVE PRICES ─── */
async function fetchPrices(){
  if(priceSt==='loading') return;
  priceSt='loading';
  const st=document.getElementById('price-status');
  if(st) st.innerHTML='<span class="price-loading"></span>Cargando precios...';
  try{
    const ids=Object.values(CRYPTO_CG).join(',');
    const r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids='+ids+'&vs_currencies=usd&include_24hr_change=true');
    if(r.ok){const d=await r.json();Object.entries(CRYPTO_CG).forEach(([t,id])=>{if(d[id])liveP[t]={price:d[id].usd,d1:d[id].usd_24h_change||0,chg52w:null};});}
  }catch(e){}
  const stocks=[...new Set(P.flatMap(p=>p.pos.map(x=>x.t)).filter(t=>!CRYPTO_CG[t]))];
  for(let i=0;i<stocks.length;i+=20){
    const batch=stocks.slice(i,i+20).join(',');
    const yurl='https://query1.finance.yahoo.com/v7/finance/quote?symbols='+batch+'&lang=en-US&region=US';
    for(const proxy of['https://corsproxy.io/?'+encodeURIComponent(yurl),'https://api.allorigins.win/get?url='+encodeURIComponent(yurl)]){
      try{
        const ctrl=new AbortController();const tid=setTimeout(()=>ctrl.abort(),6000);
        const r=await fetch(proxy,{signal:ctrl.signal});clearTimeout(tid);
        if(!r.ok) continue;
        let data=await r.json();if(data.contents) data=JSON.parse(data.contents);
        (data?.quoteResponse?.result||[]).forEach(q=>{liveP[q.symbol]={price:q.regularMarketPrice,d1:q.regularMarketChangePercent||0,chg52w:q.fiftyTwoWeekChangePercent!=null?q.fiftyTwoWeekChangePercent*100:null};});
        break;
      }catch(e){}
    }
  }
  priceTs=new Date();priceSt='done';
  const loaded=Object.keys(liveP).length;
  const st2=document.getElementById('price-status');
  if(st2) st2.textContent=loaded+'/'+P.flatMap(p=>p.pos).length+' precios · '+priceTs.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
  renderCap();updDash();
}

/* ─── CALCULADORA ─── */
function setCA(v){document.getElementById('calc-amt').value=v;updCalc();}
function toggleCalcPort(pid){
  if(selCalcPorts.includes(pid)&&selCalcPorts.length===1) return;
  selCalcPorts=selCalcPorts.includes(pid)?selCalcPorts.filter(x=>x!==pid):[...selCalcPorts,pid];
  const p=P.find(x=>x.id===pid);const on=selCalcPorts.includes(pid);
  const btn=document.getElementById('psel-'+pid);
  btn.style.background=on?p.c+'18':'var(--c2)';btn.style.borderColor=on?p.c:'var(--bdr2)';btn.style.color=on?p.c:'var(--txt)';
  P.forEach(p2=>{const cc=document.getElementById('ccard-'+p2.id);if(cc)cc.style.display=selCalcPorts.includes(p2.id)?'':'none';});
  updCalc();
}
function updCalc(){
  const a=parseFloat(document.getElementById('calc-amt')?.value)||0;
  const totPct=selCalcPorts.reduce((s,pid)=>{const p=P.find(x=>x.id===pid);return s+(p?p.pct:0);},0);
  const dr=document.getElementById('calc-drow');
  if(dr) dr.innerHTML=P.filter(p=>selCalcPorts.includes(p.id)).map(p=>{
    const ap=p.pct/totPct*100;
    return`<div class="ditem"><span class="ddot" style="background:${p.c};"></span><span style="color:${p.c};font-weight:600;">${p.nm} (${ap.toFixed(0)}%)</span><span style="color:var(--dim);">${fm(a*ap/100)}</span></div>`;
  }).join('');
  P.forEach(p=>{
    if(!selCalcPorts.includes(p.id)) return;
    const ap=p.pct/totPct*100,pa=a*ap/100;
    const lbl=document.getElementById('cplbl-'+p.id);if(lbl)lbl.textContent=ap.toFixed(0)+'% del monto';
    const amt=document.getElementById('cpamt-'+p.id);if(amt)amt.textContent=fm(pa);
    const ftot=document.getElementById('cpftot-'+p.id);if(ftot)ftot.textContent=fm(pa);
    p.pos.forEach((pos,j)=>{const el=document.getElementById('camt-'+p.id+'-'+j);if(el)el.textContent=fm(pa*pos.p/100);});
  });
}

  const row=document.getElementById('pr-'+pid+'-'+j);

}

        <div style="text-align:right;"><div style="font-size:11px;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;">Capital asignado</div>
          <div style="font-family:'Space Mono',monospace;font-size:30px;font-weight:700;color:#fff;">${pa>0?fm(pa):'Sin historial'}</div></div>
      </div>
      <div class="ph-stats">
        <div class="phstat"><div class="phstat-l">Posiciones</div><div class="phstat-v">${p.pos.length}</div><div class="phstat-s">activos</div></div>
        <div class="phstat"><div class="phstat-l">Proyección base 20yr</div><div class="phstat-v">${pa>0?fm(fv(pa,p.cagr.base,20)):'—'}</div><div class="phstat-s">CAGR ~${Math.round(p.cagr.base*100)}%/año</div></div>
        <div class="phstat"><div class="phstat-l">Participación</div><div class="phstat-v">${p.pct}%</div><div class="phstat-s">del portafolio</div></div>

      </table></div>`;

function posHistHTML(p,pos){
  if(!history.length) return'<div style="font-size:12px;color:var(--dim);padding:8px 0;">Sin inversiones registradas aún.</div>';
  const rel=history.filter(h=>!h.alloc||h.alloc[p.id]!==undefined);
  if(!rel.length) return'<div style="font-size:12px;color:var(--dim);padding:8px 0;">Ningún depósito asignado a '+p.nm+'.</div>';
  const items=rel.map(h=>{
    const portAmt=histPortAmt(h,p.id);const alloc=portAmt*pos.p/100;
    const ds=new Date(h.date+'T12:00').toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'});
    return'<div class="pe-hi"><div><div class="pe-hid">'+ds+'</div><div style="font-size:10px;color:var(--dim);">Depósito: '+fm(h.amt)+' · Al portafolio: '+fm(portAmt)+'</div></div><div class="pe-hia" style="color:'+p.c+';">'+fm(alloc)+'</div></div>';
  }).join('');
  const tot=rel.reduce((s,h)=>s+histPortAmt(h,p.id)*pos.p/100,0);
  return items+'<div class="pe-hsum"><span class="pe-hsum-l">Total en '+pos.t+'</span><span class="pe-hsum-v" style="color:'+p.c+';">'+fm(tot)+'</span></div>';
}

/* ─── HISTORIAL HPA BUTTONS ─── */
function buildHpaButtons(){
  const btns=document.getElementById('hpa-btns');if(!btns) return;
  const sel=getHistSelPorts();
  btns.innerHTML=P.map(p=>{
    const on=sel.includes(p.id);
    return'<button class="hpa-btn'+(on?' on':'') +'" id="hpab-'+p.id+'" onclick="toggleHpa(\''+p.id+'\')" style="'+(on?'background:'+p.c+';border-color:'+p.c+';color:#fff;':'border-color:'+p.c+'44;')+'"><span style="width:6px;height:6px;border-radius:50%;background:'+(on?'#fff':p.c)+';display:inline-block;"></span>'+p.nm+'</button>';
  }).join('');
  updHpaPreview();
}
function toggleHpa(pid){
  const sel=getHistSelPorts();
  if(sel.includes(pid)&&sel.length===1) return;
  histSelPorts=sel.includes(pid)?sel.filter(x=>x!==pid):[...sel,pid];
  buildHpaButtons();
}
function updHpaPreview(){
  const prev=document.getElementById('hpa-preview');if(!prev) return;
  const amt=parseFloat(document.getElementById('h-amt')?.value)||0;
  const alloc=getFormAlloc();const sel=getHistSelPorts();
  prev.innerHTML=sel.map(pid=>{
    const p=P.find(x=>x.id===pid);if(!p) return'';

      p.nm+': <strong style="font-family:\'Space Mono\',monospace;color:'+p.c+';">'+fm(a)+'</strong></span>';

}

/* ─── HISTORIAL CRUD ─── */
function addH(){
  const d=document.getElementById('h-date').value;
  const a=parseFloat(document.getElementById('h-amt').value);
  const note=document.getElementById('h-note').value.trim();
  if(!d||!a||a<=0){alert('Ingresa una fecha y monto válido.');return;}
  history.unshift({id:Date.now(),date:d,amt:a,note:note||'Sin nota',alloc:getFormAlloc()});
  saveH();renderH();renderHTotal();renderCap();updDash();
  document.getElementById('h-date').value=new Date().toISOString().split('T')[0];
  document.getElementById('h-amt').value='';document.getElementById('h-note').value='';
  if(document.getElementById('tv-hist').classList.contains('on')) updateProj();
}
async function delH(id){
  if(!confirm('¿Eliminar esta inversión?')) return;
  history=history.filter(h=>h.id!==id);
  localStorage.setItem('momo_hist',JSON.stringify(history));
  renderH();renderHTotal();renderCap();updDash();
  if(document.getElementById('tv-hist').classList.contains('on')) updateProj();
  await sheetsDelete(id);
}
function editH(id){editingId=id;renderH();}
function cancelEdit(){editingId=null;renderH();}

// Edit alloc state (using a simple object instead of DOM data attributes)
let editAllocSel={};
function toggleEditAlloc(id,pid){
  const key=id+'-'+pid;
  editAllocSel[key]=!editAllocSel[key];
  const btn=document.getElementById('eab-'+key);
  const p=P.find(x=>x.id===pid);
  if(btn){
    btn.classList.toggle('hpa-btn on',editAllocSel[key]);
    btn.classList.toggle('hpa-btn',!editAllocSel[key]);
    btn.style.background=editAllocSel[key]?p.c:'';
    btn.style.borderColor=editAllocSel[key]?p.c:p.c+'44';
    btn.style.color=editAllocSel[key]?'#fff':'';
  }
}
async function saveEdit(id){
  const d=document.getElementById('eid-'+id).value;
  const a=parseFloat(document.getElementById('eia-'+id).value);
  const n=document.getElementById('ein-'+id).value.trim();
  if(!d||!a||a<=0){alert('Fecha y monto requeridos.');return;}
  const selPids=P.filter(p=>editAllocSel[id+'-'+p.id]).map(p=>p.id);
  let finalAlloc={};
  if(selPids.length===0){P.forEach(p=>finalAlloc[p.id]=p.pct/100);}
  else{const totPct=selPids.reduce((s,pid)=>{const p=P.find(x=>x.id===pid);return s+(p?p.pct:0);},0);selPids.forEach(pid=>{const p=P.find(x=>x.id===pid);if(p)finalAlloc[pid]=p.pct/totPct;});}
  const idx=history.findIndex(h=>h.id===id);
  if(idx>-1) history[idx]={...history[idx],date:d,amt:a,note:n||'Sin nota',alloc:finalAlloc};
  editingId=null;editAllocSel={};
  localStorage.setItem('momo_hist',JSON.stringify(history));
  renderH();renderHTotal();renderCap();updDash();
  if(document.getElementById('tv-hist').classList.contains('on')) updateProj();
  const updEntry=history.find(h=>h.id===id);
  if(updEntry) await sheetsUpdate(updEntry);
}

function renderH(){
  const wrap=document.getElementById('hist-wrap');if(!wrap) return;
  if(!history.length){wrap.innerHTML='<div class="hempty">Sin inversiones registradas. Agrega la primera arriba.</div>';return;}
  wrap.innerHTML=history.map(h=>{
    const allocPids=h.alloc?Object.keys(h.alloc):P.map(p=>p.id);
    const portTags=allocPids.map(pid=>{
      const p=P.find(x=>x.id===pid);if(!p) return'';
      return'<span class="port-tag" style="background:'+p.c+'15;border:1px solid '+p.c+'30;color:'+p.c+';">'+p.nm.split(' ')[0]+' '+fm(histPortAmt(h,pid))+'</span>';
    }).join('');
    if(h.id===editingId){
      const curAlloc=h.alloc||{};
      P.forEach(p=>{editAllocSel[h.id+'-'+p.id]=curAlloc[p.id]!==undefined;});
      const editBtns=P.map(p=>{
        const on=editAllocSel[h.id+'-'+p.id];
        return'<button class="hpa-btn'+(on?' on':'') +'" id="eab-'+h.id+'-'+p.id+'" onclick="toggleEditAlloc('+h.id+',\''+p.id+'\')" style="'+(on?'background:'+p.c+';border-color:'+p.c+';color:#fff;font-size:11px;padding:5px 10px;':'border-color:'+p.c+'44;font-size:11px;padding:5px 10px;')+'">'+p.nm+'</button>';
      }).join('');
      return'<div class="hitem editing"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;">'+
        '<div class="edfld"><label>Fecha</label><input type="date" id="eid-'+h.id+'" value="'+h.date+'" style="width:144px;"></div>'+
        '<div class="edfld"><label>Monto</label><input type="number" id="eia-'+h.id+'" value="'+h.amt+'" style="width:124px;"></div>'+
        '<div class="edfld"><label>Nota</label><input type="text" id="ein-'+h.id+'" value="'+h.note+'" style="width:172px;"></div>'+
        '</div><div style="margin-top:8px;"><div class="hpa-lbl" style="font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:6px;">Portafolios</div>'+
        '<div style="display:flex;gap:5px;flex-wrap:wrap;">'+editBtns+'</div></div>'+
        '<div style="display:flex;gap:5px;margin-top:8px;"><button class="hsave" onclick="saveEdit('+h.id+')">Guardar</button><button class="hcancel" onclick="cancelEdit()">Cancelar</button></div></div>';
    }
    const ds=new Date(h.date+'T12:00').toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'});
    const allPorts=!h.alloc||Object.keys(h.alloc).length===P.length;
    return'<div class="hitem">'+
      '<div style="display:flex;align-items:center;gap:9px;flex:1;min-width:260px;">'+
      '<div class="hdate">'+ds+'</div><div class="hamt">'+fm(h.amt)+'</div><div class="hnote">'+h.note+'</div></div>'+
      '<div style="display:flex;gap:3px;flex-wrap:wrap;align-items:center;">'+portTags+(allPorts?'':'')+'</div>'+
      '<div style="display:flex;gap:5px;flex-shrink:0;">'+
      '<button class="hbtn e" onclick="editH('+h.id+')">Editar</button>'+
      '<button class="hbtn d" onclick="delH('+h.id+')">Eliminar</button></div></div>';
  }).join('');
  setTimeout(buildHpaButtons,10);
}

/* ─── PROYECCIÓN ─── */
function setYears(y){
  selYears=y;
  PRESET_YEARS.forEach(n=>{const b=document.getElementById('yr-'+n);if(b)b.classList.toggle('on',n===y);});
  const ci=document.getElementById('yr-inp');if(ci)ci.value=PRESET_YEARS.includes(y)?'':y;
  updateProj();
}
function setPF(val){
  projPortFilter=val;
  document.querySelectorAll('[id^="pf-"]').forEach(b=>{b.classList.remove('on');b.style.background='';b.style.color='';b.style.borderColor='';});
  const btn=document.getElementById('pf-'+val);
  if(btn){btn.classList.add('on');if(val!=='all'){const p=P.find(x=>x.id===val);if(p){btn.style.background=p.c;btn.style.borderColor=p.c;btn.style.color='#fff';}}}
  updateProj();
}
function setPS(val){
  projScenFilter=val;
  const scC={bear:'#ef4444',base:null,bull:'#85df04',moon:'#b806f3'};
  ['all','bear','base','bull','moon'].forEach(s=>{
    const b=document.getElementById('ps-'+s);if(!b) return;
    b.classList.remove('on');b.style.background='';b.style.color='';b.style.borderColor='';
    if(s!=='all'&&scC[s]){b.style.color=scC[s];b.style.borderColor=scC[s]+'33';}
  });
  const onBtn=document.getElementById('ps-'+val);
  if(onBtn){onBtn.classList.add('on');const c=scC[val];onBtn.style.background=c||'var(--dark)';onBtn.style.borderColor=c||'var(--dark)';onBtn.style.color='#fff';}
  updateProj();
}
function updateProj(){
  const total=ht(),yr=selYears;
  const lbl=document.getElementById('proj-yr-lbl');if(lbl)lbl.textContent=yr+' años';
  const nd=document.getElementById('proj-nodata'),cw=document.getElementById('proj-cwrap');
  if(nd&&cw){nd.style.display=total?'none':'block';cw.style.display=total?'block':'none';}
  const note=document.getElementById('proj-note');
  if(note)note.textContent=total?'Capital total: '+fm(total)+' · '+yr+' años':'Agrega inversiones para activar.';
  // TABLE
  const tbody=document.getElementById('proj-tbody');
  if(tbody){
    if(!total){tbody.innerHTML='<tr><td colspan="6" style="text-align:center;padding:18px;color:var(--dim);">Sin datos</td></tr>';return;}
    let rows='',tB=0,tBa=0,tBu=0,tM=0,tC=0;
    P.forEach(p=>{
      const pa=portTotalInvested(p.id);
      const bear=fv(pa,p.cagr.bear,yr),base=fv(pa,p.cagr.base,yr),bull=fv(pa,p.cagr.bull,yr),moon=fv(pa,p.cagr.moon,yr);
      tB+=bear;tBa+=base;tBu+=bull;tM+=moon;tC+=pa;
      rows+='<tr><td><div style="display:flex;align-items:center;gap:5px;"><span style="width:6px;height:6px;border-radius:50%;background:'+p.c+';display:inline-block;"></span><span style="font-weight:600;color:var(--dark);">'+p.nm+'</span></div></td>'+
        '<td class="r" style="font-family:\'Space Mono\',monospace;font-size:13px;font-weight:700;">'+fm(pa)+'</td>'+
        '<td class="r bear">'+fm(bear)+'</td><td class="r base">'+fm(base)+'</td><td class="r bull">'+fm(bull)+'</td><td class="r moon">'+fm(moon)+'</td></tr>';
    });
    tbody.innerHTML=rows+'<tr class="totrow"><td>TOTAL</td><td class="r" style="font-family:\'Space Mono\',monospace;font-size:14px;font-weight:700;">'+fm(tC)+'</td>'+
      '<td class="r bear" style="font-size:14px;">'+fm(tB)+'</td><td class="r base" style="font-size:14px;">'+fm(tBa)+'</td>'+
      '<td class="r bull" style="font-size:14px;">'+fm(tBu)+'</td><td class="r moon" style="font-size:14px;">'+fm(tM)+'</td></tr>';
  }
  // CHART
  const canvas=document.getElementById('proj-chart');if(!canvas||!total) return;
  const labels=Array.from({length:yr+1},(_,i)=>i===0?'Hoy':'Año '+i);
  const scDefs=[{k:'bear',l:'Bear',c:'#ef4444',d:[4,3],w:1.5},{k:'base',l:'Base',c:null,d:null,w:2},{k:'bull',l:'Bull',c:'#85df04',d:[4,3],w:1.5},{k:'moon',l:'Moon',c:'#b806f3',d:[2,2],w:1.5}];
  const activePorts=projPortFilter==='all'?P:[P.find(x=>x.id===projPortFilter)].filter(Boolean);
  const activeScens=projScenFilter==='all'?scDefs:[scDefs.find(s=>s.k===projScenFilter)].filter(Boolean);
  const datasets=[];const legItems=[];
  if(projPortFilter==='all'){
    if(projScenFilter==='all'){
      activePorts.forEach(p=>{datasets.push({label:p.nm,data:labels.map((_,i)=>Math.round(fv(portTotalInvested(p.id),p.cagr.base,i))),borderColor:p.c,backgroundColor:p.c+'12',borderWidth:2,pointRadius:0,tension:.4,fill:true});legItems.push({t:'dot',c:p.c,l:p.nm});});
      datasets.push({label:'Total',data:labels.map((_,i)=>Math.round(P.reduce((s,p)=>s+fv(portTotalInvested(p.id),p.cagr.base,i),0))),borderColor:'#111827',backgroundColor:'transparent',borderWidth:2.5,pointRadius:0,tension:.4,borderDash:[6,3]});
      legItems.push({t:'dash',c:'#111827',l:'Total (Base)'});
    } else {
      const sc=scDefs.find(s=>s.k===projScenFilter);
      activePorts.forEach(p=>{datasets.push({label:p.nm,data:labels.map((_,i)=>Math.round(fv(portTotalInvested(p.id),p.cagr[sc.k],i))),borderColor:p.c,backgroundColor:p.c+'12',borderWidth:2,pointRadius:0,tension:.4,fill:true,borderDash:sc.d||undefined});legItems.push({t:'dot',c:p.c,l:p.nm});});
      datasets.push({label:'Total '+sc.l,data:labels.map((_,i)=>Math.round(P.reduce((s,p)=>s+fv(portTotalInvested(p.id),p.cagr[sc.k],i),0))),borderColor:'#111827',backgroundColor:'transparent',borderWidth:2.5,pointRadius:0,tension:.4,borderDash:[6,3]});
      legItems.push({t:'dash',c:'#111827',l:'Total'});
    }
  } else {
    const p=activePorts[0];
    activeScens.forEach(sc=>{const c=sc.c||p.c;datasets.push({label:sc.l,data:labels.map((_,i)=>Math.round(fv(portTotalInvested(p.id),p.cagr[sc.k],i))),borderColor:c,backgroundColor:c+'15',borderWidth:sc.w,pointRadius:0,tension:.4,fill:projScenFilter!=='all',borderDash:sc.d||undefined});legItems.push({t:sc.d?'dash':'dot',c:c,l:p.nm+' · '+sc.l});});
  }
  if(projChart){projChart.data.labels=labels;projChart.data.datasets=datasets;projChart.update('none');}
  else{projChart=new Chart(canvas,{type:'line',data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${fm(c.raw)}`}}},scales:{x:{ticks:{maxTicksLimit:8,font:{size:10}},grid:{display:false}},y:{ticks:{callback:v=>fm(v),font:{size:10}},grid:{color:'rgba(0,0,0,0.03)'}}},animation:{duration:400}}});}
  const leg=document.getElementById('proj-legend');
  if(leg)leg.innerHTML=legItems.map(li=>{
    if(li.t==='dash') return'<div class="pl-item"><div style="width:16px;height:2px;border-radius:1px;background:repeating-linear-gradient(90deg,'+li.c+' 0,'+li.c+' 4px,transparent 4px,transparent 8px);flex-shrink:0;"></div>'+li.l+'</div>';
    return'<div class="pl-item"><div class="pl-dot" style="background:'+li.c+';"></div>'+li.l+'</div>';
  }).join('');
}

/* ─── INIT ─── */
buildNav();buildMain();
updDashCalc();updCalc();
setYears(20);
document.getElementById('h-date').value=new Date().toISOString().split('T')[0];
// Load from Sheets (falls back to localStorage if offline)
setTimeout(()=>{
  buildHpaButtons();
  loadFromSheets();
},100);
</script>
